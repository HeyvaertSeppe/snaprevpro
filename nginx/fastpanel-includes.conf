# ---------------------------------------------------------------------------
# snaprevpro: add WebSocket + streaming + upload support to a FastPanel site.
#
# Put this in the site's *includes* file (FastPanel does not overwrite it):
#   /etc/nginx/fastpanel2-sites/fastuser/web.heyvaertseppe.be.includes
# then run:  nginx -t && systemctl reload nginx
#
# Leave the rest of the FastPanel site config as it is. These locations take
# priority over its "location /" and over its static-file regex location.
# Change 10.1.3.241:3080 if the container's address is different.
# ---------------------------------------------------------------------------

client_max_body_size 250m;

# Live connection (WebSocket): needs HTTP/1.1 + Upgrade headers, no timeout.
location /ws {
    proxy_pass http://10.1.3.241:3080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;
}

# Fallback stream for browsers/networks that block WebSockets: never buffer.
location /stream {
    proxy_pass http://10.1.3.241:3080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    gzip off;
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;
}

# App files: always from the container, never from FastPanel's static folder.
location ^~ /assets/ {
    proxy_pass http://10.1.3.241:3080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
