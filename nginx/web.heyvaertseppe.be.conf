# ---------------------------------------------------------------------------
# Nginx reverse proxy for the gateway (FastPanel or plain Nginx).
#
# FastPanel: you only need the three `location` blocks below. Paste them into
# the site's Nginx config (Sites → web.heyvaertseppe.be → Configuration files
# → nginx), replacing the existing `location / { ... }` block and removing any
# static-file block like `location ~* ^.+\.(jpg|jpeg|gif|png|css|js|...)$`.
#
# The full server blocks are included for reference / plain-Nginx setups.
# Backend: the Docker container listens on 127.0.0.1:3080 (same server).
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name web.heyvaertseppe.be;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name web.heyvaertseppe.be;

    # FastPanel fills these in when you issue a Let's Encrypt certificate.
    ssl_certificate     /var/www/httpd-cert/web.heyvaertseppe.be.crt;
    ssl_certificate_key /var/www/httpd-cert/web.heyvaertseppe.be.key;

    client_max_body_size 250m;          # file uploads (photos/videos you send)

    # ======== copy from here (FastPanel) ========

    # Live screen / input / audio stream (WebSocket). Must not time out.
    location /ws {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }

    # Static app files. `^~` beats FastPanel's regex rules for .js/.css files.
    location ^~ /assets/ {
        proxy_pass http://127.0.0.1:3080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else (page, uploads, downloads).
    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;    # stream uploads straight through
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 250m;
        # The app sends its own Permissions-Policy (camera, microphone,
        # clipboard). Hide it and set it here once so it is never duplicated.
        proxy_hide_header Permissions-Policy;
        add_header Permissions-Policy "camera=(self), microphone=(self), clipboard-read=(self), clipboard-write=(self), fullscreen=(self), autoplay=(self)" always;
    }

    # ======== copy until here ========
}
