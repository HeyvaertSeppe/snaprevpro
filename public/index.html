<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Snapchat</title>
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/assets/manifest.webmanifest">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <canvas id="screen"></canvas>
  <button id="closepopup" hidden aria-label="Close window">✕</button>

  <div id="overlay"><div class="spinner"></div><p id="status-text">Connecting…</p></div>
  <div id="toast" role="status"></div>

  <div id="menu" hidden>
    <button data-act="link">Use this session on another device…</button>
    <button data-act="restart">Restart my browser</button>
    <button data-act="sound">Sound: on</button>
    <button data-act="close">Close menu</button>
  </div>

  <div id="modal" hidden>
    <div class="card">
      <p id="modal-text"></p>
      <input id="modal-input" type="text" hidden>
      <div class="row">
        <button id="modal-cancel" class="ghost">Cancel</button>
        <button id="modal-ok">OK</button>
      </div>
    </div>
  </div>

  <textarea id="kbd" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" aria-hidden="true"></textarea>
  <input id="filepick" type="file" hidden>
  <video id="camvideo" playsinline muted hidden></video>

  <script src="/assets/app.js"></script>
</body>
</html>
