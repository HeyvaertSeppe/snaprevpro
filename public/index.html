<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#111214">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Web</title>
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/assets/manifest.webmanifest">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header id="bar">
    <button data-act="back" title="Back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button data-act="forward" title="Forward" aria-label="Forward"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <button data-act="reload" title="Reload" aria-label="Reload"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg></button>
    <button data-act="home" title="Home" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7M6 10v10h12V10"/></svg></button>
    <div id="tabs"></div>
    <span id="live"></span>
    <button data-act="keyboard" id="btn-kbd" title="Keyboard" aria-label="Keyboard"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"/></svg></button>
    <button data-act="sound" id="btn-sound" title="Sound on/off" aria-label="Sound"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="mute" d="M16 9l6 6M22 9l-6 6"/></svg></button>
    <button data-act="hd" id="btn-hd" title="Sharper picture (uses more bandwidth)" aria-label="HD"><b>HD</b></button>
    <button data-act="fullscreen" title="Full screen" aria-label="Full screen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button data-act="menu" title="More" aria-label="More"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg></button>
  </header>

  <div id="menu" hidden>
    <button data-act="link">Use this session on another device…</button>
    <button data-act="restart">Restart my browser</button>
    <button data-act="hidebar">Hide toolbar</button>
  </div>
  <button id="showbar" data-act="showbar" title="Show toolbar" aria-label="Show toolbar" hidden><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>

  <main id="stage">
    <canvas id="screen" tabindex="0"></canvas>
  </main>

  <div id="overlay"><div class="spinner"></div><p id="status-text">Connecting…</p></div>
  <div id="toast" role="status"></div>

  <div id="modal" hidden>
    <div class="card">
      <p id="modal-text"></p>
      <input id="modal-input" type="text" hidden>
      <div class="row">
        <button id="modal-cancel" class="ghost">Cancel</button>
        <button id="modal-ok">OK</button>
      </div>
    </div>
  </div>

  <textarea id="kbd" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" aria-hidden="true"></textarea>
  <input id="filepick" type="file" hidden>
  <video id="camvideo" playsinline muted hidden></video>

  <script src="/assets/app.js"></script>
</body>
</html>
